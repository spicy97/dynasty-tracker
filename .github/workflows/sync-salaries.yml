# sync-salaries.yml
# Nightly GitHub Action — fetches the Google Sheet CSV + Sleeper rosters,
# re-matches player names to Sleeper IDs, and rebuilds data/salaries.json
# plus the data/player_names.json name lookup used by the browser app.
#
# Step 9 of requirements.md.
# NOTE: Custom Actions workflows are EXEMPT from the GitHub Pages
# 10 builds/hour soft limit, so this will not count against that quota.
#
# Requirements before enabling:
#   - Google Sheet must be publicly viewable (Share → Anyone with link → Viewer)
#   - scripts/build_salaries.py (Python 3, stdlib only — no pip installs needed)

on:
  schedule:
    - cron: '0 6 * * *'   # 6am UTC daily
  workflow_dispatch:       # also allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild salaries.json from Google Sheet + Sleeper
        run: python scripts/build_salaries.py

      - name: Commit updated salary data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/salaries.json data/player_names.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: sync salaries from Google Sheet"
          git push
